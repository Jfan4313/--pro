services:
  zhijian-pro:
    build:
      context: ..
      dockerfile: Dockerfile
    image: zhijian-pro:latest
    container_name: zhijian-pro
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      LOCAL_API_HOST: 0.0.0.0
      LOCAL_API_PORT: 8787
      LOCAL_DATA_DIR: /data
    volumes:
      - /var/lib/zhijian-pro:/data
    networks:
      - public-gateway

networks:
  public-gateway:
    external: true
    name: solar-platform_default
